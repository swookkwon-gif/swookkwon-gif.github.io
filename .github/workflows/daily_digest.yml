name: Daily AI Digest (Phase 3 — Merge & Publish)

on:
  # schedule:
  #   # 매일 UTC 20:45 (한국시간 오전 5:45) 구동
  #   # [DISABLED 2026-05-16] NLM 로컬 파이프라인으로 전환
  #   - cron: '45 20 * * *'
  workflow_dispatch: # 수동 실행 활성화

permissions:
  contents: write # Git 커밋 및 푸시 권한

jobs:
  merge-and-publish:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai python-dotenv

      - name: Run Daily Digest Merger (Phase 3)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/daily_digest.py

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 통합 포스트 및 상태 파일 스테이징
          git add "content/posts/AI News/*.md" || echo "No digest posts"
          git add scripts/state/ || true

          if git diff --staged --quiet; then
            echo "No new digest post to commit."
          else
            git commit -m "auto: daily AI digest — unified post from Phase 1+2"
            git pull --rebase origin main
            git push
          fi
