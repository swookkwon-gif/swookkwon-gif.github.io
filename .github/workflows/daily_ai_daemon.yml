name: Daily AI Blog Daemon

on:
  schedule:
    # 매일 UTC 19:15 (한국 오전 4:15) 구동
    # 깃허브 액션 지연을 감안하여 목표 시간 오전 7시 보다 약 3시간 앞당겨 실행
    - cron: '15 8 * * *'
  workflow_dispatch: # 수동 실행 버튼 활성화

permissions:
  contents: write # Git 커밋 및 푸시 권한 필요

jobs:
  run-daemon:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1 # 최신 상태만 빠르게 가져옴

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai feedparser python-slugify google-auth-oauthlib google-auth-httplib2 google-api-python-client

      - name: Create Secrets Files
        run: |
          mkdir -p scripts
          # GitHub Secrets에서 가져온 값을 JSON 파일로 복원
          echo '${{ secrets.GMAIL_CRED_JSON }}' > scripts/credentials.json
          echo '${{ secrets.GMAIL_TOKEN_JSON }}' > scripts/token_mail1.json

      - name: Run Multi-Agent Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/pipeline.py
          
      - name: Commit and Push Changes
        run: |
          # 봇 계정으로 설정
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Phase 1: 중간 결과물(JSON) 및 상태 파일만 스테이징 (포스트 미생성)
          git add scripts/state/ || true
          git add scripts/state.json || true
          git add scripts/config/ || true
          
          # 변경사항이 있을 때만 푸시
          if git diff --staged --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "auto: Phase 1 — collect & analyze AI news articles"
            git pull --rebase origin main
            git push
          fi

