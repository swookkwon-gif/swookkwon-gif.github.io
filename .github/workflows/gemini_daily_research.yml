name: Gemini Daily Deep Research

on:
  # schedule:
  #   # 매일 UTC 20:00 (한국시간 오전 5:00) 구동
  #   # [DISABLED 2026-05-16] NLM 로컬 파이프라인으로 전환
  #   - cron: '0 20 * * *'
  workflow_dispatch: # 수동 실행 활성화

permissions:
  contents: write # Git 커밋 및 푸시 권한

jobs:
  research-and-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai python-dotenv requests

      - name: Run Deep Research Auto Blogger (Gemini API)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/gf2_auto_blogger.py

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Phase 2: 딥 리서치 중간 결과물(JSON)만 스테이징 (포스트 미생성)
          git add scripts/state/ || echo "No state files to add"
          
          if git diff --staged --quiet; then
            echo "No deep research results to commit."
          else
            git commit -m "auto: Phase 2 — Gemini deep research completed"
            git pull --rebase origin main
            git push
          fi
